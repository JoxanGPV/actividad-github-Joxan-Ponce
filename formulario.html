<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Formulario de registro --> 
    <form action="procesar_formulario.php" method="POST">
        <!-- Nombre Completo -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>
        <!-- Correo electronico -->
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required><br><br>
        <!-- Contraseña -->
        <label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña" name="contraseña" required><br><br>
        <!-- Edad -->
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="0" required><br><br>
        <!-- Fecha de nacimiento -->
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required><br><br>
        <!-- Genero -->
        <label for="genero">Género:</label>
        <select id="genero" name="genero" required>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
        </select><br><br>
        <!-- Intereses -->
        <label for="intereses">Intereses:</label><br>
        <input type="checkbox" id="videojuegos" name="intereses[]" value="videojuegos">
        <label for="videojuegos">Videojuegos</label><br>
        <input type="checkbox" id="musica" name="intereses[]" value="musica">
        <label for="musica">Música</label><br>
        <input type="checkbox" id="lectura" name="intereses[]" value="lectura">
        <label for="lectura">Lectura</label><br>
        <!-- Fotografía de perfil -->
        <label for="fotografia_perfil">Fotografía de perfil:</label>
        <input type="file" id="fotografia_perfil" name="fotografia_perfil" accept="image/*"><br><br>
        <!-- Color Favorito -->
        <label for="color_favorito">Color favorito:</label>
        <input type="color" id="color_favorito" name="color_favorito"><br><br>
        <!-- Nivel de satisfacción -->
        <label for="nivel_satisfaccion">Nivel de satisfacción:</label>
        <input type="range" id="nivel_satisfaccion" name="nivel_satisfaccion" min="0" max="10"><br><br>
        <!-- Boton registrar -->
        <input type="submit" value="Registrar">
    </form>
</body>
</html>
